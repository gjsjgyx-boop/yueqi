 x1="0" y1="60" x2="1200" y2="60" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="120" x2="1200" y2="120" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="180" x2="1200" y2="180" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="240" x2="1200" y2="240" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="300" x2="1200" y2="300" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="360" x2="1200" y2="360" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="480" x2="1200" y2="480" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="540" x2="1200" y2="540" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="600" x2="1200" y2="600" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="660" x2="1200" y2="660" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="720" x2="1200" y2="720" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="780" x2="1200" y2="780" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><line x1="0" y1="840" x2="1200" y2="840" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><text x="56" y="62" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="26" fill="#EFE8DA" font-weight="900">龢 · 结构图</text><text x="56" y="86" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#7E7970" letter-spacing="1.6">STRUCTURE · 八套发声体共用一个陶腔</text><text x="1144" y="62" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#7E7970" text-anchor="end" letter-spacing="1.2">SHEET 02 / 04 · DESIGN ONLY</text><text x="1144" y="86" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11" fill="#7E7970" text-anchor="end">站内自绘示意 · 非实物照片</text><line x1="56" y1="104" x2="1144" y2="104" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><circle cx="300" cy="320" r="96" fill="rgba(200,154,107,0.07)" stroke="rgba(200,154,107,0.35)" stroke-width="1" stroke-dasharray="6 5"/><circle cx="300" cy="320" r="74" fill="rgba(200,154,107,0.11)" stroke="rgba(200,154,107,0.85)" stroke-width="1.6"/><text x="300" y="308" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="30" fill="#C89A6B" text-anchor="middle" font-weight="900">土</text><text x="300" y="332" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="12.5" fill="#C89A6B" text-anchor="middle">陶制九室</text><text x="300" y="352" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="10.5" fill="#7E7970" text-anchor="middle">公共共鸣腔</text><rect x="250" y="141" width="100" height="54" rx="10" fill="#0D1018" stroke="rgba(239,232,218,0.22)" stroke-width="1.2"/><rect x="258" y="149" width="22" height="22" rx="6" fill="#C9CDD6" opacity="0.85"/><text x="269" y="165" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#07080E" text-anchor="middle" font-weight="900">金</text><text x="287" y="165" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#EFE8DA">小钟 × 9</text><text x="258" y="186" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="9.5" fill="#7E7970">一钟双音</text><path d="M300 198 L300 240" fill="none" stroke="#C9CDD6" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.55"/><rect x="389.1660038793093" y="198.2295501174725" width="100" height="54" rx="10" fill="#0D1018" stroke="rgba(239,232,218,0.22)" stroke-width="1.2"/><rect x="397.1660038793093" y="206.2295501174725" width="22" height="22" rx="6" fill="#8FB8C9" opacity="0.85"/><text x="408.1660038793093" y="222.2295501174725" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#07080E" text-anchor="middle" font-weight="900">石</text><text x="426.1660038793093" y="222.2295501174725" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#EFE8DA">玉磬 × 9</text><text x="397.1660038793093" y="243.2295501174725" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="9.5" fill="#7E7970">清越短促</text><path d="M396.18559141241235 242.11560807404788 L366.12371148753374 274.970512115799" fill="none" stroke="#8FB8C9" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.55"/><rect x="423.53716836836463" y="326.82318196135975" width="100" height="54" rx="10" fill="#0D1018" stroke="rgba(239,232,218,0.22)" stroke-width="1.2"/><rect x="431.53716836836463" y="334.82318196135975" width="22" height="22" rx="6" fill="#B8763F" opacity="0.85"/><text x="442.53716836836463" y="350.82318196135975" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#07080E" text-anchor="middle" font-weight="900">革</text><text x="460.53716836836463" y="350.82318196135975" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#EFE8DA">蒙皮 × 9</text><text x="431.53716836836463" y="371.82318196135975" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="9.5" fill="#7E7970">鼓一面 + 皮膜八</text><path d="M422.4975729261663 348.0840383837788 L378.52245452645894 335.3043828735492" fill="none" stroke="#B8763F" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.55"/><rect x="327.2313055629254" y="429.9472679211677" width="100" height="54" rx="10" fill="#0D1018" stroke="rgba(239,232,218,0.22)" stroke-width="1.2"/><rect x="335.2313055629254" y="437.9472679211677" width="22" height="22" rx="6" fill="#E8B84B" opacity="0.85"/><text x="346.2313055629254" y="453.9472679211677" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#07080E" text-anchor="middle" font-weight="900">丝</text><text x="364.2313055629254" y="453.9472679211677" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#EFE8DA">丝弦 × 9</text><text x="335.2313055629254" y="474.9472679211677" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="9.5" fill="#7E7970">准 / 韵 / 泛音</text><path d="M351.6878727701218 430.81619938217585 L339.2975889120055 389.68284943731146" fill="none" stroke="#E8B84B" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.55"/><rect x="172.7686944370747" y="429.94726792116774" width="100" height="54" rx="10" fill="#0D1018" stroke="rgba(239,232,218,0.22)" stroke-width="1.2"/><rect x="180.7686944370747" y="437.94726792116774" width="22" height="22" rx="6" fill="#9C7A4E" opacity="0.85"/><text x="191.7686944370747" y="453.94726792116774" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#07080E" text-anchor="middle" font-weight="900">木</text><text x="209.7686944370747" y="453.94726792116774" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#EFE8DA">音块 × 9</text><text x="180.7686944370747" y="474.94726792116774" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="9.5" fill="#7E7970">既是柱也可敲</text><path d="M248.31212722987826 430.8161993821759 L260.70241108799456 389.6828494373115" fill="none" stroke="#9C7A4E" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.55"/><rect x="76.4628316316354" y="326.8231819613598" width="100" height="54" rx="10" fill="#0D1018" stroke="rgba(239,232,218,0.22)" stroke-width="1.2"/><rect x="84.4628316316354" y="334.8231819613598" width="22" height="22" rx="6" fill="#8FBF6B" opacity="0.85"/><text x="95.4628316316354" y="350.8231819613598" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#07080E" text-anchor="middle" font-weight="900">匏</text><text x="113.4628316316354" y="350.8231819613598" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#EFE8DA">自由簧 × 9</text><text x="84.4628316316354" y="371.8231819613598" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="9.5" fill="#7E7970">口吹和声底</text><path d="M177.5024270738337 348.0840383837789 L221.47754547354106 335.3043828735492" fill="none" stroke="#8FBF6B" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.55"/><rect x="110.83399612069067" y="198.2295501174725" width="100" height="54" rx="10" fill="#0D1018" stroke="rgba(239,232,218,0.22)" stroke-width="1.2"/><rect x="118.83399612069067" y="206.2295501174725" width="22" height="22" rx="6" fill="#5FC9A8" opacity="0.85"/><text x="129.83399612069067" y="222.2295501174725" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#07080E" text-anchor="middle" font-weight="900">竹</text><text x="147.83399612069067" y="222.2295501174725" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#EFE8DA">竹管 × 9</text><text x="118.83399612069067" y="243.2295501174725" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="9.5" fill="#7E7970">一管一音</text><path d="M203.8144085875876 242.11560807404788 L233.87628851246626 274.97051211579907" fill="none" stroke="#5FC9A8" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.55"/><text x="300" y="534" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#7FC4E8" text-anchor="middle">八音各九 = 72 件发声体</text><text x="300" y="556" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11" fill="#7E7970" text-anchor="middle">全部朝这里的陶腔耦合，最后从同一处出声</text><text x="300" y="576" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11" fill="#7E7970" text-anchor="middle">每一件都能单独出声，也都能拆下来单独使用</text><text x="560" y="158" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="14.5" fill="#EFE8DA" font-weight="700">为什么是「共用共鸣体」而不是「共用振动体」</text><text x="560" y="190" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="12" fill="#948E82">铜钟、石磬、竹管、丝弦、皮膜、木块、匏簧、陶腔 —— 八套振动体的构造</text><text x="560" y="215" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="12" fill="#948E82">完全不同，一个共鸣箱装不下它们；硬塞进去，声音先糊掉。</text><text x="560" y="265" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="12" fill="#948E82">所以「龢」不共用振动体，只共用共鸣体：八种材料各归其位、分散在器</text><text x="560" y="290" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="12" fill="#948E82">台四周，所有声音都朝台面下的陶制九室耦合，最后从同一处出来。</text><text x="560" y="340" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="12" fill="#948E82">这也是「八音和鸣」在物理上唯一说得通的做法 —— 不是把八件乐器捆在</text><text x="560" y="365" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="12" fill="#948E82">一起，而是让它们共用一个身体里最安静的那部分。</text><line x1="560" y1="414" x2="1144" y2="414" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><text x="560" y="442" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="14.5" fill="#EFE8DA" font-weight="700">丝九弦的三组分工（对「准」与「韵」这对矛盾）</text><rect x="560" y="458" width="3" height="42" rx="2" fill="#E8B84B" opacity="0.75"/><text x="576" y="480" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#E8B84B" font-weight="700">有柱三根</text><text x="576" y="499" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#948E82">音准稳，管快速乐句 —— 古筝移柱与扬琴的定音思路</text><rect x="560" y="516" width="3" height="42" rx="2" fill="#E8B84B" opacity="0.75"/><text x="576" y="538" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#E8B84B" font-weight="700">无柱三根</text><text x="576" y="557" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#948E82">滑音揉弦自由，最像人声 —— 二胡的无品走手</text><rect x="560" y="574" width="3" height="42" rx="2" fill="#E8B84B" opacity="0.75"/><text x="576" y="596" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="13" fill="#E8B84B" font-weight="700">摇杆三根</text><text x="576" y="615" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#948E82">一弦取整个泛音列 —— 独弦琴的摇杆</text><line x1="560" y1="668" x2="1144" y2="668" stroke="rgba(239,232,218,0.07)" stroke-width="1"/><text x="560" y="696" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="14.5" fill="#EFE8DA" font-weight="700">四肢分工（对「四类奏法只有两只手」这对矛盾）</text><rect x="560" y="716" width="132" height="74" rx="10" fill="#0D1018" stroke="rgba(127,196,232,0.35)" stroke-width="1.1"/><text x="572" y="748" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="16" fill="#7FC4E8" font-weight="900">口</text><text x="572" y="772" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="10" fill="#7E7970">气 · 簧与管</text><rect x="706" y="716" width="132" height="74" rx="10" fill="#0D1018" stroke="rgba(127,196,232,0.35)" stroke-width="1.1"/><text x="718" y="748" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="16" fill="#7FC4E8" font-weight="900">左手</text><text x="718" y="772" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="10" fill="#7E7970">按 · 韵与律</text><rect x="852" y="716" width="132" height="74" rx="10" fill="#0D1018" stroke="rgba(127,196,232,0.35)" stroke-width="1.1"/><text x="864" y="748" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="16" fill="#7FC4E8" font-weight="900">右手</text><text x="864" y="772" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="10" fill="#7E7970">弹与击 · 点</text><rect x="998" y="716" width="132" height="74" rx="10" fill="#0D1018" stroke="rgba(127,196,232,0.35)" stroke-width="1.1"/><text x="1010" y="748" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="16" fill="#7FC4E8" font-weight="900">双足</text><text x="1010" y="772" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="10" fill="#7E7970">踏轮 · 无尽弓</text><text x="560" y="830" font-family="'Noto Serif SC','Songti SC','STSong',SimSun,serif" font-size="11.5" fill="#7E7970">《尚书 · 舜典》「八音克谐，无相夺伦」—— 各有各的活，谁也不抢谁的位。</text></g>
</svg>
